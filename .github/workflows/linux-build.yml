name: Linux build and test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
          - arch: s390x
            runner: ubuntu-22.04-s390x
          - arch: ppc64le
            runner: ubuntu-22.04-ppc64le

    env:
      JOBS: 3
      PCRE_VER: "10.47"
      PCRE_PREFIX: /opt/pcre2
      PCRE_LIB: /opt/pcre2/lib
      PCRE_INC: /opt/pcre2/include
      OPENSSL_VER: "3.5.7"
      OPENSSL_PATCH_VER: "3.5.5"
      OPENSSL_PREFIX: /opt/ssl3
      OPENSSL_LIB: /opt/ssl3/lib
      OPENSSL_INC: /opt/ssl3/include
      OPENRESTY_PREFIX: /opt/openresty

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Prepare cache directory
        shell: bash
        run: mkdir -p download-cache

      - name: Cache downloaded tarballs
        uses: actions/cache@v6
        with:
          path: download-cache
          key: linux-build-${{ matrix.arch }}-${{ env.PCRE_VER }}-${{ env.OPENSSL_VER }}-${{ hashFiles('util/mirror-tarballs') }}
          restore-keys: |
            linux-build-${{ matrix.arch }}-${{ env.PCRE_VER }}-${{ env.OPENSSL_VER }}-
            linux-build-${{ matrix.arch }}-

      - name: Enable IPv6
        shell: bash
        run: |
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=0
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=0

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            axel \
            build-essential \
            ca-certificates \
            cpanminus \
            curl \
            dos2unix \
            git \
            libgd-dev \
            libpcre3 \
            libpcre3-dev \
            libpq-dev \
            mercurial \
            patch \
            perl \
            wget

          cpanm --sudo --notest Test2::Suite Test::Nginx IPC::Run3 IPC::Run

      - name: Check out test-nginx
        shell: bash
        run: |
          rm -rf test-nginx
          git clone --depth 1 https://github.com/openresty/test-nginx.git

      - name: Build PCRE2
        shell: bash
        run: |
          source .github/functions/bash/download_asfald.func.inc.sh
          pushd download-cache
          if [ ! -x asfald-latest ]; then
            download_asfald
            download_asfald latest
          fi

          if [ ! -f "pcre2-${PCRE_VER}.tar.gz" ]; then
            ./asfald-latest --verbose --output "pcre2-${PCRE_VER}.tar.gz" "https://github.com/PCRE2Project/pcre2/releases/download/pcre2-${PCRE_VER}/pcre2-${PCRE_VER}.tar.gz"
          fi
          popd

          rm -rf "pcre2-$PCRE_VER"
          tar zxf "download-cache/pcre2-$PCRE_VER.tar.gz"
          cd "pcre2-$PCRE_VER"
          ./configure --prefix="$PCRE_PREFIX" --enable-jit --enable-utf --enable-unicode-properties
          make "-j$JOBS"
          sudo env PATH="$PATH" make install

      - name: Build OpenSSL
        shell: bash
        run: |
          source .github/functions/bash/download_asfald.func.inc.sh
          pushd download-cache
          if [ ! -x asfald-latest ]; then
            download_asfald
            download_asfald latest
          fi

          if [ ! -f "openssl-${OPENSSL_VER}.tar.gz" ]; then
            ./asfald-latest --verbose --output "openssl-${OPENSSL_VER}.tar.gz" "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VER}/openssl-${OPENSSL_VER}.tar.gz"
          fi
          popd

          rm -rf "openssl-$OPENSSL_VER"
          tar zxf "download-cache/openssl-$OPENSSL_VER.tar.gz"
          cd "openssl-$OPENSSL_VER"
          patch -p1 < "../patches/openssl-$OPENSSL_PATCH_VER-sess_set_get_cb_yield.patch"
          ./config no-threads shared enable-ssl3 enable-ssl3-method -g --libdir=lib --prefix="$OPENSSL_PREFIX" -DPURIFY
          make "-j$JOBS"
          sudo make PATH="$PATH" install_sw

      - name: Build and test OpenResty
        shell: bash
        run: |
          sudo ln -sf /usr/bin/make /usr/bin/gmake

          util/mirror-tarballs
          pushd "openresty-$(./util/ver)"
          ./configure \
            --with-http_v3_module \
            --with-stream_realip_module \
            --with-http_realip_module \
            --prefix="$OPENRESTY_PREFIX" \
            --with-cc-opt="-I$PCRE_INC -I$OPENSSL_INC" \
            --with-ld-opt="-L$PCRE_LIB -L$OPENSSL_LIB -Wl,-rpath,$PCRE_LIB:$OPENSSL_LIB" \
            --with-pcre-jit \
            --with-http_ssl_module \
            --with-debug \
            "-j$JOBS"
          make "-j$JOBS"
          sudo make install
          popd

          export PATH="$OPENRESTY_PREFIX/bin:$OPENRESTY_PREFIX/nginx/sbin:$PATH"
          nginx -V
          ldd "$(command -v nginx)" | grep -E 'luajit|ssl|pcre'
          prove -Itest-nginx/inc -Itest-nginx/lib -I. -r t/
